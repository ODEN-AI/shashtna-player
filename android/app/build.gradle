apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
    // With product flavors the debug variants are fullDebug / liteDebug; they
    // load JS from Metro, every other variant bundles it into the APK.
    debuggableVariants = ["fullDebug", "liteDebug"]
}

def enableProguardInReleaseBuilds = false

def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.shashtnaplayer"

    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
        }
    }

    defaultConfig {
        applicationId "com.shashtnaplayer"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"

        externalNativeBuild {
            cmake {
                arguments(
                    "-DPROJECT_BUILD_DIR=$buildDir",
                    "-DREACT_ANDROID_DIR=$rootDir/../node_modules/react-native/ReactAndroid",
                    "-DREACT_ANDROID_BUILD_DIR=$rootDir/../node_modules/react-native/ReactAndroid/build",
                    "-DNODE_MODULES_DIR=$rootDir/../node_modules",
                    "-DANDROID_STL=c++_shared"
                )
            }
        }
    }

    signingConfigs {
        debug {
            // *.keystore is git-ignored, so a fresh clone has no android/app/debug.keystore.
            // Fall back to the standard Android debug keystore (created by AGP when missing);
            // both use androiddebugkey / android.
            def projectDebugKeystore = file('debug.keystore')
            storeFile projectDebugKeystore.exists()
                ? projectDebugKeystore
                : file("${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }

        release {
            if (project.hasProperty('SHASHTNA_UPLOAD_STORE_FILE')) {
                storeFile file(SHASHTNA_UPLOAD_STORE_FILE)
                storePassword SHASHTNA_UPLOAD_STORE_PASSWORD
                keyAlias SHASHTNA_UPLOAD_KEY_ALIAS
                keyPassword SHASHTNA_UPLOAD_KEY_PASSWORD
            }
        }
    }

    // Editions. One codebase, two apps that can be installed side by side:
    //   full: Live TV + Movies + Series. applicationId com.shashtnaplayer (unchanged).
    //   lite: Live TV only. applicationId com.shashtnaplayer.lite, launcher name from
    //         src/lite/res/values/strings.xml, JS entry index.lite.js (no VOD code).
    flavorDimensions "edition"
    productFlavors {
        full {
            dimension "edition"
            buildConfigField "String", "JS_MAIN_MODULE", '"index"'
        }
        lite {
            dimension "edition"
            applicationIdSuffix ".lite"
            versionNameSuffix "-lite"
            buildConfigField "String", "JS_MAIN_MODULE", '"index.lite"'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }

        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

// ---------------------------------------------------------------------------
// Edition JS entry: Full bundles index.js, Lite bundles index.lite.js.
//
// The React Native plugin registers createBundle<Variant>JsAndAssets from its
// own androidComponents.onVariants callback and sets entryFile to index.js in
// the task's register() action. That action runs AFTER any container-wide
// tasks.matching{}.configureEach{} registered here earlier, so setting the
// entry that way (as done before) was silently overwritten and the Lite
// release APK embedded the Full app. The entry is now set from an onVariants
// callback registered after the plugin's, via tasks.named().configure(), which
// runs after the plugin's register() action.
androidComponents {
    onVariants(selector().all()) { variant ->
        if (variant.flavorName != "lite") return
        def taskName = "createBundle${variant.name.substring(0, 1).toUpperCase()}${variant.name.substring(1)}JsAndAssets"
        // Debuggable variants have no bundle task: they load index.lite from Metro.
        if (!tasks.names.contains(taskName)) return
        tasks.named(taskName).configure { t -> t.entryFile.set(file("../../index.lite.js")) }
    }
}

// Build-time guard: a bundle task fails the build if its entry file is not the
// edition's entry, or if the finished bundle does not carry its own edition
// marker (EDITION_MARKER in App.tsx / LiteApp.tsx) or carries the other one.
// A Lite APK with the Full app inside can therefore never be produced silently.
tasks.matching { it.name ==~ /createBundle(Full|Lite)\w*JsAndAssets/ }.configureEach { t ->
    def lite = t.name.startsWith("createBundleLite")
    def expectedEntry = lite ? "index.lite.js" : "index.js"
    def ownMarker = lite ? "shashtna-edition:lite" : "shashtna-edition:full"
    def otherMarker = lite ? "shashtna-edition:full" : "shashtna-edition:lite"
    t.doFirst {
        def entry = t.entryFile.get().asFile.name
        if (entry != expectedEntry) {
            throw new GradleException("${t.name}: JS entry is ${entry}, expected ${expectedEntry}")
        }
    }
    t.doLast {
        def bundle = new File(t.jsBundleDir.get().asFile, t.bundleAssetName.get())
        def content = new String(bundle.bytes, "ISO-8859-1")
        if (!content.contains(ownMarker) || content.contains(otherMarker)) {
            throw new GradleException("${t.name}: ${bundle} is not the ${lite ? 'Lite' : 'Full'} bundle " +
                "(expected marker ${ownMarker}, must not contain ${otherMarker})")
        }
        logger.lifecycle("${t.name}: verified ${bundle.name} (entry ${expectedEntry}, marker ${ownMarker})")
    }
}

// Keep `gradlew clean` working with autolinked New Architecture libraries.
// :app:externalNativeBuildClean* re-configures CMake, which includes the
// generated Android-autolinking.cmake and add_subdirectory()s each library's
// codegen output (<library>/android/build/generated/source/codegen/jni).
// That output is missing after a fresh `npm install` or a library `clean`,
// so the app's native clean failed before `:app:clean` could remove the stale
// CMake state. Run each library's codegen after its own `clean` and before the
// app's native clean. It is the same task instance that preBuild uses, so a
// `clean assembleDebug` still generates it only once.
def appProject = project
rootProject.subprojects { lib ->
    if (lib == appProject) return
    lib.pluginManager.withPlugin("com.facebook.react") {
        lib.tasks.matching {
            it.name == "generateCodegenSchemaFromJavaScript" || it.name == "generateCodegenArtifactsFromSchema"
        }.configureEach {
            it.mustRunAfter(lib.tasks.matching { t -> t.name == "clean" })
        }
        appProject.tasks.matching { it.name.startsWith("externalNativeBuildClean") }.configureEach {
            it.dependsOn(lib.tasks.matching { t -> t.name == "generateCodegenArtifactsFromSchema" })
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        // The React Native Gradle plugin substitutes this with
        // com.facebook.hermes:hermes-android (currently 0.14.0), which ships both the
        // Java classes and libhermesvm.so for every ABI and build type. Do not add a
        // second copy of those classes (e.g. an extracted classes jar) or of the .so
        // files under src/main/jniLibs: that duplicates the AAR.
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
