apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false

def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.shashtnaplayer"

    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
        }
    }

    defaultConfig {
        applicationId "com.shashtnaplayer"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"

        externalNativeBuild {
            cmake {
                arguments(
                    "-DPROJECT_BUILD_DIR=$buildDir",
                    "-DREACT_ANDROID_DIR=$rootDir/../node_modules/react-native/ReactAndroid",
                    "-DREACT_ANDROID_BUILD_DIR=$rootDir/../node_modules/react-native/ReactAndroid/build",
                    "-DNODE_MODULES_DIR=$rootDir/../node_modules",
                    "-DANDROID_STL=c++_shared"
                )
            }
        }
    }

    signingConfigs {
        debug {
            // *.keystore is git-ignored, so a fresh clone has no android/app/debug.keystore.
            // Fall back to the standard Android debug keystore (created by AGP when missing);
            // both use androiddebugkey / android.
            def projectDebugKeystore = file('debug.keystore')
            storeFile projectDebugKeystore.exists()
                ? projectDebugKeystore
                : file("${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }

        release {
            if (project.hasProperty('SHASHTNA_UPLOAD_STORE_FILE')) {
                storeFile file(SHASHTNA_UPLOAD_STORE_FILE)
                storePassword SHASHTNA_UPLOAD_STORE_PASSWORD
                keyAlias SHASHTNA_UPLOAD_KEY_ALIAS
                keyPassword SHASHTNA_UPLOAD_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }

        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        // The React Native Gradle plugin substitutes this with
        // com.facebook.hermes:hermes-android (currently 0.14.0), which ships both the
        // Java classes and libhermesvm.so for every ABI and build type. Do not add a
        // second copy of those classes (e.g. an extracted classes jar) or of the .so
        // files under src/main/jniLibs: that duplicates the AAR.
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
